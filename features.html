            function createTranslator() {
              let isSpeechEnabled = false; // This state is encapsulated within the closure

                    ? "Speech-to-Text Enabled"
                    : "Speech-to-Text Disabled"
                );
              }

              return toggleSpeech; // Return the closure that will remember the state of speech

              });

            // Convert text to the selected sign language
            function convertTextToSign(text) {
              let signImage;
              if (currentLanguage === "asl") {
                signImage = aslDictionary[text.toLowerCase()];
              } else if (currentLanguage === "rsl") {
                signImage = rslDictionary[text.toLowerCase()];
              }

              // Display the corresponding sign
              if (signImage) {
                document.getElementById("signDisplay").src = signImage;
              } else {
                document.getElementById("signDisplay").src =
                  "images/default_sign.png";
              }
            }
