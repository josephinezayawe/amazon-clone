<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .view {
        display: flex;
        flex-direction: column;
        width: 200px;
        margin: 300px;
      }
      .log {
        margin-top: 12px;
        background-color: blue;
        color: white;
        font-size: 15px;
        cursor: pointer;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <nav class="view">
      <h1>Enter Password</h1>
      <input id="text" placeholder="Password" />
      <button onclick="CheckPassword()" class="log">Log In</button>
      <p class="error" id="errorMessage"></p>
    </nav>
    <script>
      function CheckPassword() {
        let correctPassword = "23042020";
        let password = document.getElementById("text").value;
        let error = document.getElementById("errorMessage");
        if (correctPassword === password) {
          window.location.href = "dashboard.html";
        } else {
          errorMessage.textContent = "fuck you!😊";
        }
      }
    </script>
  </body>
</html>
